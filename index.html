<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#350711">
<meta name="description" content="Wedding invitation of Farhana Ayoob and Shafeeq K. N.">
<title>Farhana &amp; Shafeeq | Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--wine:#350711;--wine2:#4b0c1b;--wine3:#21040b;--gold:#c99b4b;--gold2:#f0d99b;--cream:#f7efdf;--muted:#d9c6a3}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--wine3);color:var(--cream);font-family:'Cormorant Garamond',serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 50% 10%,#64172a66,transparent 58%),repeating-linear-gradient(135deg,#d5aa4a08 0 1px,transparent 1px 34px)}
main{position:relative}.shell{max-width:1000px;margin:auto;padding:100px 24px;text-align:center;position:relative}.hero{min-height:100svh;padding:22px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#601326 0%,#410a19 56%,#22040c 100%)}
.frame{width:min(100%,760px);min-height:calc(100svh - 48px);padding:40px 24px 30px;border:1px solid var(--gold);outline:1px solid #c99b4b77;outline-offset:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 0 0 8px #c99b4b0c,inset 0 0 55px #0005}
.frame:before,.frame:after{content:'❧';position:absolute;color:var(--gold);font-size:34px}.frame:before{top:8px;left:14px;transform:rotate(-35deg)}.frame:after{right:14px;bottom:8px;transform:rotate(145deg)}
.flourish{color:var(--gold);letter-spacing:9px;font-size:18px}.bismillah{font:clamp(27px,6vw,39px) 'Amiri',serif;color:var(--gold2);margin:15px 0 5px}.eyebrow{font:10px Georgia,serif;letter-spacing:3.5px;color:var(--gold);margin:12px 0 17px}.monogram{display:block;width:min(76vw,390px);height:auto;margin:12px auto 8px;filter:drop-shadow(0 10px 22px #0008)}
.hero h1{font-size:clamp(43px,9vw,76px);font-weight:500;line-height:1;margin:8px 0;color:var(--cream)}h1 em,.script-amp{font-family:'Great Vibes';font-style:normal;color:var(--gold2)}.kicker{font-size:19px;color:var(--muted);margin:12px 0 0}.hero-date{letter-spacing:5px;color:var(--gold2);font-size:16px;margin:15px 0 18px}.open-btn{border:1px solid var(--gold);background:linear-gradient(135deg,#f0d99b,#b68132);color:#350711;padding:13px 28px;font:11px Georgia;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.25s}.open-btn:hover{transform:translateY(-3px);box-shadow:0 8px 22px #0005}.scroll-hint{font:9px Georgia;letter-spacing:3px;color:var(--muted);margin:28px 0 0}.scroll-hint span{display:block;color:var(--gold);font-size:22px;margin-top:6px}
section:not(.hero){border-bottom:1px solid #c99b4b22}.intro,.families,.details,.countdown-section{background:linear-gradient(180deg,#26050d,#430b1a 50%,#26050d)}.ornament{font-size:27px;color:var(--gold);margin-bottom:12px}.shell h2{font-size:clamp(35px,7vw,54px);font-weight:400;color:var(--gold2);margin:0 0 18px}.copy{max-width:620px;margin:20px auto;color:#eadfc9;font-size:20px;line-height:1.55}.names{font:clamp(44px,9vw,68px) 'Great Vibes';margin:24px 0;color:var(--cream)}.rule{width:min(250px,65%);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:30px auto;position:relative}.rule:after{content:'✧';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#390713;padding:0 12px;color:var(--gold)}
.families{background:radial-gradient(ellipse at center,#511024,#25050d 75%)}.family-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:22px;align-items:center;max-width:760px;margin:42px auto 0}.family-card{border:1px solid #c99b4b99;padding:30px 18px;background:linear-gradient(145deg,#c99b4b12,#0002);min-height:235px;display:flex;flex-direction:column;align-items:center;justify-content:center}.family-label{font:10px Georgia;letter-spacing:3px;color:var(--gold)}.family-card h3{font-size:29px;font-weight:500;color:var(--gold2);margin:10px 0}.family-card p{font-size:17px;margin:6px;color:var(--muted)}.family-card strong{font: bold 11px Georgia;letter-spacing:1.5px;color:var(--cream);margin:6px}.family-card>span,.family-divider{color:var(--gold)}.family-divider{font-size:24px}
.date-medallion{width:180px;height:180px;border:1px solid var(--gold);outline:1px solid #c99b4b66;outline-offset:6px;border-radius:50%;margin:36px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#64162b,#390713);color:var(--gold2)}.date-medallion span{font:10px Georgia;letter-spacing:3px}.date-medallion strong{font-size:76px;font-weight:400;line-height:.95}.detail{display:flex;gap:18px;align-items:center;justify-content:center;text-align:left;margin:26px auto;max-width:390px}.detail-icon{width:46px;height:46px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:21px;flex-shrink:0}.detail small{display:block;font:10px Georgia;letter-spacing:3px;color:var(--gold);margin-bottom:5px}.detail strong{font-size:23px;font-weight:600}.detail p{font-size:17px;margin:3px 0;color:var(--muted)}
.countdown{display:flex;justify-content:center;align-items:center;gap:clamp(7px,3vw,24px);margin:42px auto 0}.countdown div{min-width:58px;display:flex;flex-direction:column;gap:7px}.countdown strong{font-size:clamp(32px,7vw,54px);font-weight:400;color:var(--gold2);font-variant-numeric:tabular-nums}.countdown span{font:9px Georgia;letter-spacing:2px;color:var(--gold)}.countdown i{font-size:26px;color:var(--gold);font-style:normal;margin-top:-14px}
.closing{background:radial-gradient(ellipse at center,#601529,#24040d 78%);padding-top:70px;padding-bottom:70px}.closing-frame{max-width:760px;margin:auto;padding:48px 24px;border:1px solid var(--gold);outline:1px solid #c99b4b66;outline-offset:7px}.arabic{font:27px/1.8 'Amiri',serif;color:var(--gold2)}.translation{font-size:18px;line-height:1.5;color:#e8dbc1;max-width:520px;margin:18px auto}.reference{font:9px Georgia;letter-spacing:2px;color:var(--gold)}.closing .monogram{width:120px;margin:22px auto 8px}.closing h2{font-size:38px;margin:0}.closing-names{font:42px 'Great Vibes';color:var(--gold2);margin:8px 0 22px}
.reveal{opacity:0;transform:translateY(36px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}.reveal.visible{opacity:1;transform:translateY(0)}.petals{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}.petal{position:absolute;top:-24px;width:7px;height:12px;border-radius:90% 0 90% 0;background:linear-gradient(135deg,#f0d99b,#a96b35);opacity:.45;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(620deg);opacity:0}}
@media(max-width:620px){.shell{padding:76px 20px}.hero{padding:15px 12px}.frame{min-height:calc(100svh - 30px);padding:34px 16px 24px}.monogram{width:min(76vw,310px)}.family-grid{grid-template-columns:1fr;gap:12px;max-width:360px}.family-card{min-height:200px}.family-divider{transform:rotate(90deg);line-height:1}.countdown{gap:6px}.countdown div{min-width:50px}.countdown span{font-size:8px;letter-spacing:1px}.countdown i{font-size:19px}.arabic{font-size:23px}.detail{max-width:310px}.detail strong{font-size:20px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}.petals{display:none}}
</style>
</head>
